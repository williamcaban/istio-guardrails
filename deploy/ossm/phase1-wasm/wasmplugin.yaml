# Phase 1: WasmPlugin — input guardrail
# Used instead of TrafficExtension (not available in Istio 1.27/1.28 on this cluster)
# Targets pods labeled: guardrails.trustyai.io/config=pii
#
# BEFORE APPLYING: update nemoCluster with the actual Envoy cluster name.
# Run: oc exec -n app-ns deploy/test-app -c istio-proxy -- \
#        pilot-agent request GET /clusters | grep nemo-pii
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: nemo-input-guard
  namespace: app-ns
spec:
  selector:
    matchLabels:
      guardrails.trustyai.io/config: pii
  phase: AUTHN
  priority: 10
  url: oci://quay.io/rhai-guardrails/nemo-wasm-guard:0.1.0-poc
  pluginConfig:
    nemoCluster: "outbound|8000||nemo-pii.guardrails.svc.cluster.local"
    nemoHost: "nemo-pii.guardrails.svc.cluster.local"
    nemoPath: "/v1/guardrail/checks"
    timeoutMs: 300
    failMode: "closed"

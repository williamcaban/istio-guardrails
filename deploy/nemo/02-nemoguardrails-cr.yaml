apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: nemo-pii
  namespace: guardrails
spec:
  # nemoConfigs[].name is the config DIRECTORY name inside /app/config/<name>/
  # It must be alphanumeric/dashes/underscores — NOT the ConfigMap name.
  # Confirmed: name: "pii" creates /app/config/pii/ mounted from nemo-pii-config.
  nemoConfigs:
    - name: pii
      configMaps:
        - nemo-pii-config
      default: true
  env:
    - name: OPENAI_API_KEY
      value: not-used

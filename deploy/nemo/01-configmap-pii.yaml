apiVersion: v1
kind: ConfigMap
metadata:
  name: nemo-pii-config
  namespace: guardrails
data:
  config.yaml: |
    # models: [] prevents NeMo from attempting LLM generation on clean requests.
    # Without this, NeMo tries to call a configured LLM, fails with the
    # placeholder API key, and returns 504 to Envoy on allowed (non-PII) requests.
    models: []
    rails:
      config:
        sensitive_data_detection:
          input:
            entities:
              - EMAIL_ADDRESS
              - PERSON
              - PHONE_NUMBER
              - US_SSN
              - CREDIT_CARD
            score_threshold: 0.5
        regex_detection:
          input:
            patterns:
              - "\\b(password|secret|api[_-]?key|token)\\b"
              - "\\d{3}-\\d{2}-\\d{4}"
            case_insensitive: true
      input:
        flows:
          - detect sensitive data on input
          - regex check input
      output:
        flows: []
  rails.co: |
    # Built-in input rails only — no dialog or output rails

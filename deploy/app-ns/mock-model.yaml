# Mock model server — POC testing only
#
# A proper Python HTTP/1.1 server that echoes the request body back as JSON.
# Labeled guardrails.trustyai.io/config=pii so the TrafficExtension applies.
#
# IMPORTANT: Must be a proper HTTP/1.1 server, NOT nc/netcat.
# Envoy sidecars require valid responses with Content-Length headers.
# nc-based shells cause 503 errors on clean (allowed) requests because they
# close the TCP connection after each read without sending valid HTTP headers.
#
# When guardrail BLOCKS: Lua returns 403 before the mock server is called.
# When guardrail ALLOWS: request reaches the mock server and gets a 200 response.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-model
  namespace: app-ns
  labels:
    app: mock-model
    guardrails.trustyai.io/config: pii
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-model
  template:
    metadata:
      labels:
        app: mock-model
        guardrails.trustyai.io/config: pii
    spec:
      containers:
      - name: echo
        image: registry.access.redhat.com/ubi9/python-39:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          python3 -c "
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json, logging
          logging.basicConfig(level=logging.INFO)

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  logging.info(fmt % args)
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  resp = json.dumps({
                      'status': 'ok',
                      'message': 'model response',
                      'echo': body.decode()
                  }).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(resp)))
                  self.end_headers()
                  self.wfile.write(resp)
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{\"status\":\"ok\"}')

          HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
          "
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-model
  namespace: app-ns
spec:
  selector:
    app: mock-model
  ports:
  - port: 8080
    targetPort: 8080
